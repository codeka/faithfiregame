[package]
name = "client-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
editor = []

[dependencies]
shared = { path = "../shared" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
glow = "0.16"
glam.workspace = true
png.workspace = true
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "EventTarget",
    "Headers",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "Location",
    "MessageEvent",
    "MouseEvent",
    "Performance",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "WebGl2RenderingContext",
    "WebSocket",
    "WheelEvent",
    "Window",
    "console",
]
