[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/client-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
serde_json = "1.0"
glam = { version = "0.30", features = ["serde"] }
