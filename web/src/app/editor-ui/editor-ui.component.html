<div class="editor-overlay">
  <app-editor-toolbar />

  @if (engine.initError(); as err) {
    <div class="error-banner">Engine initialization failed: {{ err }}</div>
  }

  <aside class="toolbox" aria-label="Tool Controls">
    @switch (state.activeTool()) {
      @case ('heightmap') {
        <app-heightmap-tool />
      }
      @case ('texture') {
        <app-texture-tool />
      }
      @case ('road') {
        <app-road-tool />
      }
      @default {
        <app-decoration-tool />
      }
    }
  </aside>

  @if (state.showNewAreaModal()) {
    <app-create-area-modal />
  }
</div>
