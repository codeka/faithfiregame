<div class="toolbox-title">Texture Brush</div>

<div class="tool-section">
  <span class="section-label">Material Layer</span>
  <div class="option-grid">
    @for (layer of textureLayers; track layer.index) {
      <button
        type="button"
        class="btn btn-sm swatch-btn"
        [class.active]="activeTexLayer() === layer.index"
        (click)="engine.setTextureLayer(layer.index)"
      >
        <span class="swatch" [style.background]="layer.swatch"></span>
        {{ layer.label }}
      </button>
    }
  </div>
</div>

<div class="tool-section">
  <span class="section-label">Brush</span>
  <label class="slider-field">
    <span class="slider-head">
      <span>Radius</span>
      <span>{{ state.brushRadius().toFixed(1) }} m</span>
    </span>
    <input
      type="range"
      name="texBrushRadius"
      min="1"
      max="16"
      step="0.5"
      [ngModel]="state.brushRadius()"
      (ngModelChange)="state.setBrushRadius($event)"
    />
  </label>
  <label class="slider-field">
    <span class="slider-head">
      <span>Strength</span>
      <span>{{ state.brushStrength().toFixed(1) }}</span>
    </span>
    <input
      type="range"
      name="texBrushStrength"
      min="0.5"
      max="12"
      step="0.5"
      [ngModel]="state.brushStrength()"
      (ngModelChange)="state.setBrushStrength($event)"
    />
  </label>
</div>

<div class="toolbox-hint">Drag on terrain to blend material.</div>
