<div class="toolbox-title">Heightmap Brush</div>

<div class="tool-section">
  <span class="section-label">Sculpt Mode</span>
  <div class="option-grid">
    @for (mode of modes; track mode) {
      <button
        type="button"
        class="btn btn-sm"
        [class.active]="activeHeightMode() === mode"
        (click)="engine.setHeightMode(mode)"
      >
        {{ mode[0].toUpperCase() + mode.slice(1) }}
      </button>
    }
  </div>
</div>

<div class="tool-section">
  <span class="section-label">Brush</span>
  <label class="slider-field">
    <span class="slider-head">
      <span>Radius</span>
      <span>{{ state.brushRadius().toFixed(1) }} m</span>
    </span>
    <input
      type="range"
      name="heightBrushRadius"
      min="1"
      max="16"
      step="0.5"
      [ngModel]="state.brushRadius()"
      (ngModelChange)="state.setBrushRadius($event)"
    />
  </label>
  <label class="slider-field">
    <span class="slider-head">
      <span>Strength</span>
      <span>{{ state.brushStrength().toFixed(1) }}</span>
    </span>
    <input
      type="range"
      name="heightBrushStrength"
      min="0.5"
      max="12"
      step="0.5"
      [ngModel]="state.brushStrength()"
      (ngModelChange)="state.setBrushStrength($event)"
    />
  </label>
</div>

<div class="toolbox-hint">Drag on terrain to sculpt height.</div>
